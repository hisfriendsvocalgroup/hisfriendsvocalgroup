<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News & Concerts – His Friends Vocal Group</title>
  <meta name="description" content="Upcoming concerts and announcements from His Friends Vocal Group.">
  <link rel="icon" href="assets/img/album-cover.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Montserrat:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=20261122d">
</head>
<body data-page="news">
<main id="main">
  <section class="page-hero">
    <div class="container">
      <p class="eyebrow" data-i18n="news.label"></p>
      <h1 data-i18n="news.title"></h1>
      <p class="lead" data-i18n="news.sub"></p>
    </div>
  </section>
  <section class="section">
    <div class="container">
      <h2 class="reveal" data-i18n="news.next"></h2>
      <div class="concerts" data-concerts></div>

      <h2 class="reveal" data-i18n="news.past" style="margin-top:clamp(56px,8vw,96px)"></h2>
      <div class="news-list">
        <article class="news-item reveal">
          <img src="assets/img/album-cover.jpg" alt="Around His Table album cover" loading="lazy">
          <div class="body">
            <span class="tag" data-i18n="news.release.date"></span>
            <h3 data-i18n="news.release.title"></h3>
            <p data-i18n="news.release.p"></p>
            <a class="btn btn-outline" href="music.html"><span data-i18n="hero.listen"></span></a>
          </div>
        </article>
      </div>
    </div>
  </section>
  <section class="section" style="padding-top:0">
    <div class="container"><div class="cta reveal"><h2 data-i18n="cta.title"></h2><p data-i18n="cta.p"></p><a class="btn btn-dark" href="contact.html"><span data-i18n="cta.btn"></span></a></div></div>
  </section>
</main>
<script src="assets/js/i18n.js?v=20261122d"></script>
<script src="assets/js/data.js?v=20261122d"></script>
<script src="assets/js/main.js?v=20261122d"></script>
</body>
</html>
