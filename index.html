<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>His Friends Vocal Group – A cappella from Basel</title>
  <meta name="description" content="His Friends Vocal Group is a male a cappella ensemble from Basel, Switzerland, celebrating the love of God through the beauty of music. Debut album: Around His Table.">
  <meta property="og:title" content="His Friends Vocal Group – Around His Table">
  <meta property="og:image" content="assets/img/album-cover.jpg">
  <link rel="icon" href="assets/img/album-cover.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Montserrat:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/vendor/scrollcraft.css?v=20261125a">
  <link rel="stylesheet" href="assets/css/style.css?v=20261125a">
</head>
<body data-page="home" class="has-hero">
<span data-sc-progress aria-hidden="true"></span>
<main id="main">

  <!-- HERO with animated CD -->
  <section class="hero">
    <div class="notes" aria-hidden="true"></div>
    <div class="container hero-grid">
      <div>
        <span class="logo reveal" aria-hidden="true">
          <span class="l1">H</span><span class="bar"></span><span class="r1">S</span>
          <span class="l2">fr</span><span class="r2">ends</span>
          <span class="l3">vocal</span><span class="r3">group</span>
        </span>
        <p class="eyebrow reveal" data-delay="1" data-i18n="hero.eyebrow"></p>
        <h1 class="reveal" data-delay="1" data-i18n="hero.title"></h1>
        <p class="lead reveal" data-delay="2" data-i18n="hero.sub"></p>
        <div class="hero-actions reveal" data-delay="3">
          <a class="btn btn-primary" href="#listen" data-sc-magnet="0.25"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="7 4 20 12 7 20"/></svg><span data-i18n="hero.listen"></span></a>
          <a class="btn btn-ghost" href="contact.html" data-sc-magnet="0.25"><span data-i18n="hero.book"></span></a>
        </div>
      </div>

      <div class="hero-cd">
    <div class="dp-stage" role="img" aria-label="Around His Table CD opening">
      <div class="dp-shadow"></div>
      <div class="dp">
        <div class="dp-panel dp-center">
          <div class="dp-face dp-front" style="background-image:url(assets/img/cd/in-tray.jpg)"></div>
          <div class="dp-face dp-back" style="background-image:url(assets/img/cd/out-back.jpg)"></div>
          <div class="dp-disc"><div class="dp-disc-spin"><div class="disc-face"></div></div></div>
        </div>
        <div class="dp-panel dp-left">
          <div class="dp-face dp-front" style="background-image:url(assets/img/cd/in-en.jpg)"></div>
          <div class="dp-face dp-back" style="background-image:url(assets/img/cd/out-front.jpg)"></div>
        </div>
        <div class="dp-panel dp-right">
          <div class="dp-face dp-front" style="background-image:url(assets/img/cd/in-de.jpg)"></div>
          <div class="dp-face dp-back" style="background-image:url(assets/img/cd/out-flap.jpg)"></div>
        </div>
      </div>
    </div>
      </div>
    </div>
  </section>

  <!-- ABOUT -->
  <section class="section" id="about" data-sc-act="flow">
    <div class="container about-grid">
      <div class="about-photo reveal">
        <div class="photo-frame" data-sc-reveal="up" data-sc-reveal-at="0.12 0.42"><img src="assets/img/group-smiling.jpg" alt="The five members of His Friends Vocal Group laughing together" loading="lazy" width="1600" height="752"></div>
      </div>
      <div>
        <p class="eyebrow reveal" data-i18n="about.label"></p>
        <h2 class="reveal" data-i18n="about.title"></h2>
        <p class="reveal" data-i18n="about.p1"></p>
        <p class="reveal" data-i18n="about.p2"></p>
        <h3 class="reveal" data-i18n="about.members" style="margin-top:28px"></h3>
        <ul class="members reveal" data-members></ul>
        <dl class="stats reveal">
          <div><dt><span data-sc-count="0 5" data-sc-count-at="0.3 0.55">5</span></dt><dd data-i18n="stats.voices"></dd></div>
          <div><dt><span data-sc-count="0 10" data-sc-count-at="0.3 0.55">10</span></dt><dd data-i18n="stats.songs"></dd></div>
          <div><dt><span data-sc-count="0 2" data-sc-count-at="0.3 0.55">2</span></dt><dd data-i18n="stats.langs"></dd></div>
        </dl>
      </div>
    </div>
  </section>

  <!-- STATEMENT (lines arrive by themselves when the section comes into view) -->
  <section class="statement" data-sc-act="flow" aria-labelledby="st-title" data-statement>
    <div class="statement-stage">
      <img class="statement-photo" src="assets/img/statement-voices.jpg" alt="" data-sc-parallax="-0.08">
      <div class="statement-scrim" aria-hidden="true"></div>
      <div class="container statement-copy">
        <h2 id="st-title" class="sr-only" data-i18n="st.all"></h2>
        <p class="st-line" aria-hidden="true" data-i18n="st.l1"></p>
        <p class="st-line" aria-hidden="true" data-i18n="st.l2"></p>
        <p class="st-line" aria-hidden="true" data-i18n="st.l3"></p>
        <p class="st-line st-line--peak" aria-hidden="true" data-i18n="st.l4"></p>
      </div>
    </div>
  </section>

  <!-- UPCOMING CONCERTS -->
  <section class="section" style="padding-top:0">
    <div class="container">
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px;margin-bottom:32px">
        <div>
          <p class="eyebrow reveal" data-i18n="news.label"></p>
          <h2 class="reveal" data-i18n="news.next" style="margin:0"></h2>
        </div>
        <a class="btn btn-outline reveal" href="news.html"><span data-i18n="news.all"></span></a>
      </div>
      <div class="concerts" data-concerts data-limit="3"></div>
    </div>
  </section>

  <!-- ALBUM STORY -->
  <section class="section dark">
    <div class="container album-grid">
      <div>
        <p class="eyebrow reveal" data-i18n="album.label"></p>
        <h2 class="reveal" data-i18n="album.title"></h2>
        <p class="reveal" data-i18n="album.p1"></p>
        <p class="reveal" data-i18n="album.p2"></p>
      </div>
      <div class="album-quote reveal" data-delay="1">
        <blockquote class="quote"><span data-i18n="album.quote"></span><footer>Amen.</footer></blockquote>
      </div>
    </div>
  </section>

  <!-- PLAY THROUGH THE ALBUM (signature: scroll moves through the tracklist) -->
  <section class="play" id="tracks" data-sc-act="pin" data-sc-span="3" data-play>
    <div class="sc-stage play-stage" data-sc-stage>
      <div class="container play-grid">
        <div class="play-disc" aria-hidden="true">
          <div class="play-disc__spin"><img src="assets/img/cd-disc.jpg" alt="" width="900" height="900"></div>
        </div>
        <div class="play-side">
          <p class="eyebrow" data-i18n="play.label"></p>
          <p class="play-now" aria-live="polite"><span class="play-num" data-play-num>01</span><span class="play-title" data-play-title></span></p>
          <h3 class="play-h" data-i18n="album.tracks"></h3>
          <div class="play-window"><ol class="tracklist" data-tracklist></ol></div>
        </div>
      </div>
    </div>
  </section>

  <!-- LISTEN -->
  <section class="section" id="listen">
    <div class="container">
      <div class="listen-card reveal">
        <div>
          <p class="eyebrow" data-i18n="listen.label"></p>
          <h2 data-i18n="listen.title"></h2>
          <p class="lead" data-i18n="listen.sub"></p>
          <div class="listen-actions">
            <a class="btn btn-spotify" data-spotify target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0a12 12 0 1 0 0 24 12 12 0 0 0 0-24Zm5.5 17.3a.75.75 0 0 1-1 .25c-2.85-1.74-6.45-2.14-10.68-1.17a.75.75 0 1 1-.33-1.46c4.63-1.06 8.6-.6 11.77 1.34.36.22.47.68.25 1.04Zm1.47-3.27a.94.94 0 0 1-1.29.31c-3.26-2-8.23-2.58-12.09-1.41a.94.94 0 1 1-.54-1.8c4.4-1.33 9.88-.68 13.6 1.6.44.27.58.85.32 1.3Zm.13-3.4C15.18 8.3 8.73 8.08 5 9.21a1.12 1.12 0 1 1-.65-2.15c4.28-1.3 11.4-1.05 15.9 1.62a1.12 1.12 0 1 1-1.15 1.93Z"/></svg><span data-i18n="listen.spotify"></span></a>
            <a class="btn btn-apple" data-apple target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M12 0a12 12 0 1 0 0 24 12 12 0 0 0 0-24Zm4.6 5.62-6.9 1.42a.75.75 0 0 0-.6.73v7.1a2.3 2.3 0 1 0 1.5 2.15v-6.4l5.4-1.12v3.85a2.3 2.3 0 1 0 1.5 2.15V6.35a.75.75 0 0 0-.9-.73Z"/></svg><span data-i18n="listen.apple"></span></a>
            <a class="btn btn-youtube" data-youtube target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0a12 12 0 1 0 0 24 12 12 0 0 0 0-24Zm0 19.2a7.2 7.2 0 1 1 0-14.4 7.2 7.2 0 0 1 0 14.4Zm0-13.2a6 6 0 1 0 0 12 6 6 0 0 0 0-12Zm-2.1 9.3V8.7L15.6 12l-5.7 3.3Z"/></svg><span data-i18n="listen.youtube"></span></a>
          </div>
          <p style="margin-top:20px"><a href="music.html" data-i18n="listen.full"></a></p>
        </div>
        <iframe data-spotify-embed title="Spotify player – Around His Table" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
      </div>
    </div>
  </section>

  <!-- CTA -->
  <section class="section" style="padding-top:0">
    <div class="container">
      <div class="cta reveal">
        <h2 data-i18n="cta.title"></h2>
        <p data-i18n="cta.p"></p>
        <a class="btn btn-dark" href="contact.html" data-sc-magnet="0.25"><span data-i18n="cta.btn"></span></a>
      </div>
    </div>
  </section>
</main>

<script src="assets/js/i18n.js?v=20261125a"></script>
<script src="assets/js/data.js?v=20261125a"></script>
<script src="assets/vendor/scrollcraft.js?v=20261125a"></script>
<script src="assets/js/main.js?v=20261125a"></script>
</body>
</html>
